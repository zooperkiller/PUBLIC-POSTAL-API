<template>
  <section class="form-section">
    <h1>ENTER INDIAN PINCODE</h1>
    <lightning-input
      type="text"
      label="Enter Pincode"
      value={pincode}
      onchange={handleInputChange}
      max-length="6"
      message-when-too-long="Pincode must be 6 digits"
      pattern="[0-9]{6}"
      class="input-box"
      placeholder="6-digit number"
    ></lightning-input>

    <template if:true={isValid}>
      <lightning-button
        label="Submit"
        onclick={handleSubmit}
        variant="brand"
        class="submit-btn"
      ></lightning-button>
    </template>
  </section>

  <template if:true={openSection}>
    <div class="tiles-container">
      <template for:each={result.PostOffice} for:item="office">
        <div key={office.Name} class="tile">
          <p><strong>{office.Name}</strong></p>
          <p>{office.BranchType} | {office.DeliveryStatus}</p>
          <p>{office.Circle}</p>
          <p>{office.District}, {office.State}</p>
          <p>{office.Country}</p>
        </div>
      </template>
    </div>
    </template>
    
    
</template>
