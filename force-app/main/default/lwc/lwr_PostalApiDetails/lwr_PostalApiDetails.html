<template>
  <section class="form-section">
    <lightning-input
      type="text"
      label="Enter Pincode"
      value={pincode}
      onchange={handleInputChange}
      max-length="6"
      message-when-too-long="Pincode must be 6 digits"
      pattern="[0-9]{6}"
      class="input-box"
      placeholder="6-digit number"
    ></lightning-input>

    <template if:true={isValid}>
      <lightning-button
        label="Submit"
        onclick={handleSubmit}
        variant="brand"
        class="submit-btn"
      ></lightning-button>
    </template>
  </section>
</template>
